name: Ops Brain Quality
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ops-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install verified Gitleaks 8.30.1
      run: 'curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        -o /tmp/gitleaks.tar.gz

        echo ''551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz''
        | sha256sum -c -

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks'
    - name: Scan tracked history with redacted findings
      run: /tmp/gitleaks git --redact --no-banner --log-opts="--all" .
  node-root:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install locked dependencies
      run: npm ci --no-audit --no-fund
    - name: build
      run: npm run build
    - name: Report missing unit tests
      run: echo '::warning::No unit-test script exists. Functional coverage is incomplete;
        see CI_ROLLOUT.md.'
    - name: Dependency vulnerability gate
      run: npm audit --audit-level=high
    - name: Upload build artifact for this commit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: build-root-${{ github.sha }}
        path: '.next

          !.next/cache/**'
        if-no-files-found: error
        retention-days: 7
